[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall"
version = "0.1.0"
description = "A DAST CLI for API authz bugs: every finding is a deterministic, replayable check."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dee" }]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "click>=8.1",
    "PyJWT>=2.8",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "respx>=0.21"]
# heimdall-vulnapp, the project's own deliberately-vulnerable scan target.
vulnapp = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
# `heimdall sast` shells out to the real semgrep binary this extra installs.
sast = ["semgrep>=1.70"]

[project.scripts]
heimdall = "heimdall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
