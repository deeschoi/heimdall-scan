# Accepted-risk register for Oedipus CI.
#
# Schema (each row):
#   fingerprint  12-char hex Finding.fingerprint
#                sha1("{check_id}|{METHOD}|{path_template}")[:12]
#   owner        person accountable for the risk
#   expiry       YYYY-MM-DD (inclusive). After this date the finding is
#                no longer suppressed and --fail-on will fail CI again.
#   reason       why this finding is tracked instead of fixed
#
# Consumed by `oedipus scan --accepted-risk` and `oedipus gate`.
# Expired rows stay in the file as history; they do not suppress.

