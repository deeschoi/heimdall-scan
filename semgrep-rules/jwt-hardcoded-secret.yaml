rules:
  - id: jwt-hardcoded-secret
    languages: [python]
    severity: ERROR
    message: >-
      A JWT is signed or verified with a string literal secret, or a secret
      is assigned from a hardcoded string. A secret baked into source (and
      therefore into every checkout, wordlist-guessable, or shared across
      environments) lets an attacker forge tokens that pass signature
      verification (CWE-347).
    metadata:
      cwe: CWE-347
      owasp: API2:2023
      heimdall_severity: high
      references:
        - https://cwe.mitre.org/data/definitions/347.html
    pattern-either:
      - pattern: jwt.encode($PAYLOAD, "...", ...)
      - pattern: jwt.decode($TOKEN, "...", ...)
      - patterns:
          - pattern: $SECRET = "..."
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i).*(jwt_secret|jwt_key|signing_key|token_secret).*
