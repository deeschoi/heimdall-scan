# Heimdall benchmark targets.
#
# These mirror the containers already running on this host so `heimdall eval`
# has a reproducible way to bring them up on a fresh machine / in CI.
#
#   docker compose -f benchmarks/compose.yml up -d
#
# VAmPI is run twice: vulnerable=1 (scored) and vulnerable=0 (false-positive
# control). crAPI has its own large compose at crAPI-main/deploy/docker.
#
# Every port is published on 127.0.0.1 only: these targets are vulnerable on
# purpose, and a bare "8000:8000" would expose them (vulnapp's SSRF included)
# to everyone on the operator's network. Inside the containers the apps still
# listen on 0.0.0.0 -- that is what lets Docker forward to them.
services:
  # Heimdall's OWN target (this repo). Two builds: vulnerable (scored) and
  # hardened (false-positive control). See vulnapp/ and suites/vulnapp.yaml.
  vulnapp-vuln:
    build:
      context: ../vulnapp
    container_name: vulnapp-vuln
    environment:
      - VULNAPP_SAFE=0
    ports:
      - "127.0.0.1:8000:8000"

  vulnapp-safe:
    build:
      context: ../vulnapp
    container_name: vulnapp-safe
    environment:
      - VULNAPP_SAFE=1
    ports:
      - "127.0.0.1:8001:8000"

  vampi-vuln:
    image: erev0s/vampi:latest
    container_name: vampi-vuln
    environment:
      - vulnerable=1
      - tokentimetolive=300
    ports:
      - "127.0.0.1:5001:5000"

  vampi-safe:
    image: erev0s/vampi:latest
    container_name: vampi-safe
    environment:
      - vulnerable=0
      - tokentimetolive=300
    ports:
      - "127.0.0.1:5002:5000"

  # Optional breadth/demo target (CTF-style; used as a stretch suite, not a
  # resume metric). Comment out if you don't need it.
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "127.0.0.1:3000:3000"
