# crAPI — second, harder suite (realistic multi-tenant microservice API).
#
# The full crAPI stack is expected on http://127.0.0.1:8888 (crapi-web).
# Its OpenAPI spec ships in the repo: crAPI-main/openapi-spec/crapi-openapi-spec.json
# MailHog (signup VIN/pincode emails) is on http://127.0.0.1:8025.
#
# Auth was built once via the normal signup flow (POST /identity/api/auth/signup)
# and the VIN/pincode emails in MailHog GET /api/v2/messages (quoted-printable
# Raw.Data; Content.Body is empty). Vehicles were then added with
# POST /identity/api/v2/vehicle/add_vehicle. Subsequent evals just log in —
# crAPI does not require an OTP at login. If the crAPI DB is wiped, re-run
# signup + MailHog VIN add + contact_mechanic (see expected/crapi.json notes).

name: crapi
target: http://127.0.0.1:8888
openapi: ../../crAPI-main/openapi-spec/crapi-openapi-spec.json
expected: ../expected/crapi.json
payloads_dir: ../payloads

checks: [sqli, exposure, bola, ssrf, jwt]

auth:
  user_a:
    type: login
    register: { path: /identity/api/auth/signup,
                json: { email: oed_crapi_a@example.com, name: OedCrapiA,
                        number: "5550100001", password: OedCrapi!a123 } }
    login:    { path: /identity/api/auth/login,
                json: { email: oed_crapi_a@example.com, password: OedCrapi!a123 },
                token_field: token }
  user_b:
    type: login
    register: { path: /identity/api/auth/signup,
                json: { email: oed_crapi_b@example.com, name: OedCrapiB,
                        number: "5550100002", password: OedCrapi!b123 } }
    login:    { path: /identity/api/auth/login,
                json: { email: oed_crapi_b@example.com, password: OedCrapi!b123 },
                token_field: token }

hints:
  # Challenge 1: user_b reads user_a's vehicle location by UUID. Canary is
  # user_a's fullName from GET .../location (confirmed 2026-09-14).
  bola:
    - read: { path: "/identity/api/v2/vehicle/81b3b134-d915-4d36-8fa0-e4ace61b3e9c/location",
              method: GET, as: user_b,
              path_template: "/identity/api/v2/vehicle/{vehicleId}/location" }
      canary: "OedCrapiA"

    # Challenge 2: sequential report_id has no ownership check. user_a filed
    # report 6 with a unique problem_details canary; user_b reads it.
    - read: { path: "/workshop/api/mechanic/mechanic_report?report_id=6",
              method: GET, as: user_b,
              path_template: "/workshop/api/mechanic/mechanic_report" }
      canary: "HEIMDALL_CANARY_crapi_rpt7f3a"

  # Challenge 11: contact_mechanic fetches mechanic_api server-side.
  # 169.254.169.254/latest/meta-data/ timed out (no IMDS sidecar). MailHog
  # is on the compose network; the HTML title is the reflected canary.
  ssrf:
    - path: /workshop/api/merchant/contact_mechanic
      method: POST
      param: mechanic_api
      location: body
      as: user_a
      canary: "http://mailhog:8025/"
      match: "MailHog"

  # Challenge 15: dashboard accepts alg=none. Tokens are RS256, so the weak
  # HMAC wordlist (including "crapi") does not apply.
  jwt:
    identity: user_a
    protected: { path: /identity/api/v2/user/dashboard, method: GET }
