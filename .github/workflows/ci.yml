name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,vulnapp,sast]"
      - name: Unit + vulnapp integration tests (no external targets)
        # vulnapp boots as an in-process subprocess, so this runs end-to-end
        # without Docker. Only the vendored VAmPI live test needs containers.
        run: pytest -q -p no:cacheprovider tests --ignore=tests/test_vampi_live.py
